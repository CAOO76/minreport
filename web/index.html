<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <title>MINREPORT</title>

  <!-- Init Theme Script (Prevent FOUC) -->
  <script>
    (function () {
      try {
        var localTheme = localStorage.getItem('theme');
        var isDarkSystem = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (localTheme === 'dark' || (!localTheme && isDarkSystem)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body class="bg-[#FFFFFF] dark:bg-[#000000] text-[#0F172A] dark:text-[#F3F4F6] antialiased min-h-screen select-none">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
