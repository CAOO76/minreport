name: CI - Build & Verify

on:
  push:
    branches: [ main, master, MINREPORT_ANTIGRAVITY, 'feature/*', 'fix/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, master, MINREPORT_ANTIGRAVITY, 'feature/*', 'fix/*', 'hotfix/*' ]

jobs:
  build-and-deploy:
    name: Build, Verify & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Sync Plugins & Build Core
        run: |
          npm run sync:plugins
          npm run build

      - name: Build Cloud Functions
        run: |
          cd services/functions
          npm ci
          npm run build

      - name: Build Web Client
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Admin Panel
        run: |
          cd admin
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting (Preview)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINREPORT_8F2A8 }}'
          projectId: minreport-8f2a8

      - name: Deploy to Firebase (Production)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/MINREPORT_ANTIGRAVITY')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINREPORT_8F2A8 }}'
          channelId: live
          projectId: minreport-8f2a8

