name: CI - Build, Verify & Deploy (southamerica-west1)

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'hotfix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Typecheck, Unit Tests, Build & Deploy Hosting
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINREPORT_8F2A8 != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            services/functions/package-lock.json
            web/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Verify & Build Backend Core (TypeScript Strict)
        run: |
          npm run audit:privacy
          npx tsc --noEmit
          npm run build

      - name: Build Cloud Functions Gen 2 (southamerica-west1)
        run: |
          cd services/functions
          npm ci
          npm run build

      - name: Install, Typecheck, Test & Build Unified Web PWA
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'minreport-8f2a8.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'minreport-8f2a8' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'minreport-8f2a8.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_EMULATORS: 'false'
        run: |
          cd web
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build

      - name: Deploy Preview Channel (Firebase Hosting minreport-web)
        if: github.event_name == 'pull_request' && env.HAS_FIREBASE_SERVICE_ACCOUNT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINREPORT_8F2A8 }}'
          projectId: minreport-8f2a8
          target: minreport-web

      - name: Deploy Live Channel (Firebase Hosting minreport-web)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_FIREBASE_SERVICE_ACCOUNT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINREPORT_8F2A8 }}'
          channelId: live
          projectId: minreport-8f2a8
          target: minreport-web
