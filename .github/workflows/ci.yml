name: CI - Build & Verify (southamerica-west1)

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'hotfix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Privacy Audit, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            services/functions/package-lock.json
            web/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Verify & Build Backend Core (TypeScript Strict & Ley 21.719)
        run: |
          npm run audit:privacy
          npx tsc --noEmit
          npm run build

      - name: Build Cloud Functions Gen 2 (southamerica-west1)
        run: |
          cd services/functions
          npm ci
          npm run build

      - name: Install, Typecheck, Test & Build Unified Web PWA
        env:
          VITE_FIREBASE_AUTH_DOMAIN: 'minreport-8f2a8.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'minreport-8f2a8'
          VITE_FIREBASE_STORAGE_BUCKET: 'minreport-8f2a8.firebasestorage.app'
          VITE_USE_EMULATORS: 'false'
        run: |
          cd web
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build
